name: Mirror to Personal Repo

on:
  push:
    branches:
      - main
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      
      - name: Mirror to personal repo
        run: |
          git remote add personal git@github.com:fort-solar/fortsolar-landing-webapp-clone.git
          git push --mirror personal
